[package]
name = "onlypassword-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "onlypassword_desktop"
path = "src/lib.rs"

[[bin]]
name = "onlypassword-desktop"
path = "src/main.rs"

[dependencies]
onlypassword-core = { path = "../onlypassword-core" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = { version = "0.37", default-features = false }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
egui_kittest = "0.37"
tempfile = "3"
onlypassword-core = { path = "../onlypassword-core", features = ["insecure-fast-kdf", "test-hooks"] }
