[package]
name = "onlypassword-core"
version = "0.1.0"
edition = "2021"
publish = false

[features]
insecure-fast-kdf = []
test-hooks = []

[dependencies]
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
sha2 = "0.11.1"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.154"
