[package]
name = "onlypassword-core"
version = "0.1.0"
edition = "2021"
publish = false

[features]
insecure-fast-kdf = []
test-hooks = []

[dependencies]
argon2 = { version = "0.6.0", features = ["alloc", "zeroize"] }
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
sha2 = "0.11.1"
sha1 = "0.11"
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
unicode-normalization = "0.1.26"
zeroize = { version = "1", features = ["derive"] }
bip39 = { version = "2", default-features = false }


[dev-dependencies]
tempfile = "3"
onlypassword-core = { path = ".", features = ["insecure-fast-kdf"] }
